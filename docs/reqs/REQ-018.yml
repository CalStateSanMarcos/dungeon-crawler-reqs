text: |
  The Player's interaction capabilities SHALL be managed using the **State
  Pattern**.
  - The Player object must delegate behavior to a state object (e.g.,
    `ExplorationState`, `CombatState`, `InventoryState`).
  - Input commands must be interpreted differently depending on the current
    state (e.g., the command "Run" works in `CombatState` but might be invalid
    or interpreted differently in `InventoryState`).
