text: |
  The game SHALL implement a main Game Loop pattern that continuously cycles
  through three distinct phases:
  1. Input Processing (reading user commands)
  2. Game State Update (resolving logic)
  3. Rendering (outputting text descriptions)
  This SHOULD be similar to an interpreter's REPL.
