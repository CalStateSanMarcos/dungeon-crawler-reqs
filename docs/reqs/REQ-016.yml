text: |
  User input commands shall be processed using the **Chain of Responsibility
  Pattern**.
  - A chain of specific handlers (e.g., `MovementHandler` -> `CombatHandler` ->
    `InventoryHandler` -> `SystemHandler`) must be established.
  - When the user types a command, it is passed down the chain until a handler
    recognizes the syntax and processes it.
