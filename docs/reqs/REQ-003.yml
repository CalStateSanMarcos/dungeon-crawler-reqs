text: |
  Upon entering a room, the system SHALL display a textual description of the
  environment, including visible exits, items visibly lying on the floor, and
  any entities present.
  - The system MAY display hieroglyphics (emoticons) or other visual
    information to guide the player through the space of your world.
  - The system MAY display a minimap for the player's benefit.
