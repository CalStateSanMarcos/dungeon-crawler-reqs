text: |
  Enemy combat behavior shall be implemented using the **Strategy Pattern**.
  - Enemies must be capable of switching behaviors at runtime (e.g., switching
    from an 'AggressiveStrategy' to a 'FleeingStrategy' when their health drops
    below 20%).
